[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabarc-media-organiser"
version = "0.1.0a0"
description = "Local-first, read-only media inventory and catalogue"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.26,<1"]

[project.scripts]
tabarc-media = "tabarc_media.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabarc_media = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
