[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabarc-media-organiser"
version = "0.2.0"
description = "Read-only media inventory and catalogue for Plex and Jellyfin libraries"
readme = "README.md"
authors = [{ name = "TABARC-Code" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
tabarc-media = "tabarc_media.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tabarc_media.config" = ["default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
